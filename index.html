<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CANNON CLASH 砲台對轟</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0d12;
    }
    /* Logical resolution is fixed at 1600x900; CSS scales it to fit the window. */
    canvas { max-width: 100vw; max-height: 100vh; }
  </style>
</head>
<body>
  <canvas id="game" width="1600" height="900"></canvas>
  <!-- Script order matters: view modules first, then the entry point.
       Later tasks append their own files here (core -> view -> main). -->
  <script src="src/view/loader.js"></script>
  <script src="src/view/layers.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
