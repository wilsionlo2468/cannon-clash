<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CANNON CLASH 砲台對轟</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0d12;
    }
    /* Logical resolution is fixed at 1600x900; CSS letterboxes it to the
       window (16:9), scaling both down AND up (e.g. 1080p fullscreen). */
    canvas {
      width: min(100vw, calc(100vh * 16 / 9));
      height: calc(min(100vw, calc(100vh * 16 / 9)) * 9 / 16);
    }
  </style>
</head>
<body>
  <canvas id="game" width="1600" height="900"></canvas>
  <!-- Script order matters: core modules first, then view, then the entry point.
       Later tasks append their own files here (core -> view -> main). -->
  <script src="src/core/ballistics.js"></script>
  <script src="src/core/terrain.js"></script>
  <script src="src/core/weapons.js"></script>
  <script src="src/core/cannon.js"></script>
  <script src="src/core/match.js"></script>
  <script src="src/core/ai.js"></script>
  <script src="src/core/leaderboard.js"></script>
  <script src="src/core/supply.js"></script>
  <script src="src/view/loader.js"></script>
  <script src="src/view/layers.js"></script>
  <script src="src/view/camera.js"></script>
  <script src="src/view/sprites.js"></script>
  <script src="src/view/effects.js"></script>
  <script src="src/view/hud.js"></script>
  <script src="src/view/input.js"></script>
  <script src="src/view/scenes.js"></script>
  <script src="src/view/audio.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
